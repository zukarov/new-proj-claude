[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polymarket-claude-bot"
version = "0.1.0"
description = "Claude AI + Polymarket automated prediction market trading bot"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "py-clob-client>=0.34.6",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=14.0.0",
    "click>=8.1.0",
    "structlog>=24.0.0",
    "apscheduler>=3.10.0",
    "tenacity>=8.2.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
]

[project.scripts]
trading-bot = "bot.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
